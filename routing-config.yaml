# =============================================================================
# IT Ticket Auto-Router — Control Panel
# -----------------------------------------------------------------------------
# This is the ONLY file you normally need to edit.
# Change a percentage, a skill, a rule, or pause the agent here, then commit.
# The routine reads this file fresh on every run.
# =============================================================================

# --- Kill switch -------------------------------------------------------------
# Set to false to pause ALL assignment immediately on the next run.
# (The agent checks this first and does nothing else if false.)
enabled: true
# --- Dry run -------------------------------------------------------------
# true = compute and report assignments, but write NOTHING to Jira.
# Keep true until the migration test is signed off.
dry_run: true

# --- When the agent is allowed to act ----------------------------------------
# Schedule: the routine is triggered ONCE per working day at 11:00, set in the
# routine's Scheduled trigger (cron: 0 11 * * 1-5, timezone Europe/Berlin).
# The bounds below are a safety guard only: if a run is ever started manually or
# off-schedule, the agent still acts only on a weekday within these hours.
business_hours:
  timezone: "Europe/Berlin"
  start_hour: 8          # guard: earliest hour the agent may act
  end_hour: 17           # guard: latest hour the agent may act
  active_days: [Mon, Tue, Wed, Thu, Fri]

# --- Jira scope --------------------------------------------------------------
jira:
  project_key: "SPAITSM"
  # REST API base for the svc-itsm-router service account (scoped token, Bearer auth).
  api_base: "https://api.atlassian.com/ex/jira/158d2ea6-e8a7-4716-9042-bc0e6ca1b043"
  # Used only to make ticket keys clickable in the Slack summary.
  site_url: "https://sportalliance.atlassian.net"
  # Tickets considered "needs assignment".
  # Uses statusCategory, NOT status names: this instance has duplicate status
  # names (e.g. more than one status called "Cancelled"), so name-based
  # exclusion leaks cancelled tickets. statusCategory != Done reliably excludes
  # every Done-category status (Done, Resolved, Cancelled) regardless of dupes.
  unassigned_jql: 'project = SPAITSM AND assignee IS EMPTY AND statusCategory != Done'
  # How current workload is measured when balancing toward targets.
  # "open" = count each person's not-Done tickets in this project.
  load_basis: "open"

# --- Assignment strategy -----------------------------------------------------
# Evaluation order per ticket: priority_routing -> keyword_routing -> skill match.
#
# load_balanced  : among eligible people, pick whoever is FURTHEST below their
#                  target_pct share right now. Drives real distribution toward
#                  your targets and is fully explainable. (recommended)
# weighted_random: pick randomly, weighted by target_pct. Simpler, drifts more.
strategy: "load_balanced"

# What to do when a ticket matches NO ONE's skills:
#   fallback_to_all = true  -> route by percentage among the full team
#   fallback_to_all = false -> leave unassigned, flag it in the run summary
fallback_to_all: true
# --- Keyword/skill matching mode -------------------------------------------
# substring = current behaviour ("iru" also matches "virus").
# word      = whole-word match only. Decided during the migration test.
match_mode: "substring"
# Shadow compare: each run also computes what the OTHER match_mode would
# have assigned, and lists any differences in the summary. Never writes.
shadow_compare: true

# --- Availability check -------------------------------------------------------
# Before assigning, the agent checks each candidate's Slack status (via
# slack_user_id below). Anyone whose status clearly signals they're not working
# today (out of office, vacation, travelling, sick, etc.) is skipped for this
# run — even if they're otherwise the best/only match. Set to false to disable
# the check entirely (e.g. Slack connector down) and assign as if everyone's in.
availability_check: true

# Cap on how many tickets ONE person can be assigned in a SINGLE run. Once a
# member reaches this many assignments this run, they are excluded from all
# further eligibility (priority, keyword, skill, and fallback). If every
# eligible member for a ticket is capped, the ticket is left unassigned and
# flagged — it will be picked up on the next run. Prevents one under-loaded
# person absorbing a whole day's backlog at once. Applies to keyword_routing
# members too, even though they sit outside the percentage system.
max_per_run_per_person: 3

# --- Priority routing --------------------------------------------------------
# Evaluated FIRST, before keywords and skills. If a ticket's priority matches a
# key here, it routes straight to the named member(s), bypassing keyword/skill
# match. Use for must-own categories like critical incidents.
# Value may be a single name or a list of names (load-balanced among them).
# Priority names must match your Jira priority scheme EXACTLY (case-insensitive).
# Confirm under Project settings -> Priorities. JSM default is often
# Highest/High/Medium/Low/Lowest — adjust the key below if yours differs.
priority_routing:
  Critical: "Mateusz Maslowski"

# --- Keyword routing ----------------------------------------------------------
# Evaluated SECOND, after priority routing and before skill match/load
# balancing. If ANY keyword below appears in the ticket's summary+description
# (case-insensitive), the ticket routes straight to that named member —
# entirely bypassing skill match, fallback, and the percentage system. Use
# this for a dedicated specialist who owns a narrow category outright and
# should NOT be load-balanced (no target_pct — they are not part of `team`
# and don't count toward the 100% split).
# Still subject to max_per_run_per_person; if the member is capped, the
# ticket is deferred to the next run rather than falling through to `team`.
keyword_routing:
  - name: "Bartosz Tomaszewski"
    account_id: "712020:90cfbf3f-5038-454f-a00b-2481879f54c1"
    slack_user_id: "U07F596UTQR"     # bartosz.tomaszewski@sportalliance.com
    keywords: [network, wifi, wi-fi, hosting, odwijka]

# --- Team --------------------------------------------------------------------
# target_pct values should sum to 100. The agent warns if they don't.
# account_id: Atlassian accountId (NOT display name).
# slack_user_id: Slack user ID, used for the availability check above.
# skills: lowercase keywords matched against the ticket summary + description.
team:
