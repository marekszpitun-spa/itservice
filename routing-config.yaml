    slack_user_id: "U0B1DD3GJ9E"     # luka.perez@sportalliance.com
    skills: [hardware purchase, access request, onboarding, offboarding, system incident]
    target_pct: 25

  - name: "Jordan Klimczak"
    account_id: "712020:fbfd0a88-df7f-497a-b6a4-346c577bdab1"
    slack_user_id: "U085SD203B7"     # jordan.klimczak@sportalliance.com
    skills: [okta, access, provisioning, onboarding, offboarding, sso, hardware purchase, license, system incident]
