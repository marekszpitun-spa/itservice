    account_id: "712020:be1ab9db-f323-4c30-b3dd-26f133acac68"
    slack_user_id: "U09EAEZ8DD4"     # mateusz.maslowski@sportalliance.com
    skills: [okta, iru, user access, security incident, hardware purchase, system incident]
